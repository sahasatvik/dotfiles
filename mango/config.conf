#
# key bindings
#

bind=Super+Shift,Slash,spawn_shell,     pkill rofi || ~/bin/mangowm_help.sh                             #? keybindings

# reload config
bind=Super+Shift,r,reload_config                                                                        #? reload wm configuration

# applications
bind=Super,Return,spawn,                kitty                                                           #? terminal (kitty)
bind=Super+Alt,Return,spawn,            kitty --app-id kitty-floating                                   #? terminal, floating

# rofi menus
bind=Super,Space,spawn_shell,           pkill rofi || rofi -show drun -modi run,drun                    #? application launcher (rofi)
bind=Super+Alt,Space,spawn_shell,       pkill rofi || ~/bin/finder.sh                                   #? file finder
bind=Super+Alt,c,spawn_shell,           pkill rofi || rofi -show calc -modi calc                        #? calculator
bind=Super+Alt,f,spawn_shell,           pkill rofi || rofi -show filebrowser -modi filebrowser          #? file browser
bind=Super+Alt,b,spawn_shell,           pkill rofi || ~/bin/bookmarks.sh                                #? browser bookmarks
bind=Super+Alt+Shift,b,spawn_shell,     pkill rofi || ~/bin/qutesessions.sh                             #? browser sessions
bind=Super+Alt,e,spawn_shell,           pkill rofi || ~/bin/configs.sh                                  #? configuration files
bind=Super+Alt,w,spawn_shell,           pkill rofi || ~/bin/wallchoose.sh                               #? wallpaper gallery
bind=Super+Alt,s,spawn_shell,           pkill rofi || ~/bin/screenshots.sh                              #? screenshot gallery

# screenshots
bind=Super+Alt,p,spawn,                 ~/bin/screenshot.sh desktop                                     #? screenshot, screen
#bind=Super+Alt,{4 | 5 | 6},                                                                            #? screenshot, {screen | selection | window}
bind=Super+Alt,4,spawn,                 ~/bin/screenshot.sh desktop
bind=Super+Alt,5,spawn,                 ~/bin/screenshot.sh selection
bind=Super+Alt,6,spawn,                 ~/bin/screenshot.sh window

# exit
bind=Super+Shift,q,quit                                                                                 #? log out
bind=Super+Alt,q,spawn_shell,           pkill rofi || ~/bin/powermenu.sh                                #? power menu
bind=Super+Shift,b,spawn_shell,         pkill mangobar || mangobar                                      #? toggle bar
bind=Super,w,killclient                                                                                 #? close window

# switch window focus
bind=Super,Tab,focusstack,next                                                                          #? focus stack, next
bind=Super+Shift,Tab,focusstack,prev                                                                    #? focus stack, previous
#bind=Alt,{Up | Down | Left | Right},                                                                   #? focus window
bind=Alt,Left,focusdir,left
bind=Alt,Right,focusdir,right
bind=Alt,Up,focusdir,up
bind=Alt,Down,focusdir,down
#bind=Super,{Left | Right},                                                                             #? focus window
bind=Super,Left,focusdir,left
bind=Super,Right,focusdir,right

# jump
bind=Super,Slash,togglejump,                                                                            #? window jumper

# overcircle
#bind=Super,{BracketLeft | BracketRight},                                                               #? window overcircle
bind=Super,BracketRight,overcircle,current_next
bind=Super,BracketLeft,overcircle,current_prev
#bind=Super+Shift,{BracketLeft | BracketRight},                                                         #? window overcircle, global
bind=Super+Shift,BracketRight,overcircle,next
bind=Super+Shift,BracketLeft,overcircle,prev

# switcher
#bind=Super,{Period | Comma},                                                                           #? window switcher
bind=Super,Period,switcher,next
bind=Super,Comma,switcher,prev
#bind=Super+Shift,{Period | Comma},                                                                     #? window switcher, global
bind=Super+Shift,Period,switcher,all_next
bind=Super+Shift,Comma,switcher,all_prev

# move window
#bind=Super+Alt,{Up | Down | Left | Right},                                                             #? move window
bind=Super+Alt,Up,move_client,up
bind=Super+Alt,Down,move_client,down
bind=Super+Shift,Left,move_client,left
bind=Super+Shift,Right,move_client,right

# switch window status
bind=Super,g,toggleglobal,                                                                              #? toggle window state, global
bind=Super,Backslash,togglefloating,                                                                    #? toggle window state, floating
bind=Super,f,togglemaximizescreen,                                                                      #? toggle window state, maximized
bind=Super+Shift,f,togglefullscreen,                                                                    #? toggle window state, full screen
bind=Alt+Shift,f,togglefakefullscreen,                                                                  #? toggle window state, fake full screen
# bind=Super,o,toggleoverlay,
bind=Super,h,minimized,                                                                                 #? minimize window
bind=Super+Shift,h,restore_minimized,                                                                   #? restore minimized window
# bind=Alt,z,toggle_scratchpad

# layouts
circle_layout=scroller,tile
bind=Super,l,switch_layout                                                                              #? cycle layout (scrolling, tiled)

# scroller
bind=Super+Shift,e,set_proportion,1.0                                                                   #? set window proportion, full
bind=Super,e,switch_proportion_preset,                                                                  #? cycle window proportion
#bind=Super+Alt,{Left | Right},                                                                         #? move window stack
bind=Super+Alt,Left,scroller_stack,left
bind=Super+Alt,Right,scroller_stack,right
# bind=Super+Alt,Up,scroller_stack,up
# bind=Super+Alt,Down,scroller_stack,down

# tag switching
#bind=Super,{Up | Down},                                                                                #? focus tag
bind=Super,Up,viewtoleft,0
bind=Super,Down,viewtoright,0
# bind=CTRL,Up,viewtoleft_have_client,0
# bind=CTRL,Down,viewtoright_have_client,0

#bind=Super,{1-9},                                                                                      #? focus tag, {1-9}
bind=Super,1,view,1,0
bind=Super,2,view,2,0
bind=Super,3,view,3,0
bind=Super,4,view,4,0
bind=Super,5,view,5,0
bind=Super,6,view,6,0
bind=Super,7,view,7,0
bind=Super,8,view,8,0
bind=Super,9,view,9,0

# special tags for browsing, music
bind=Super,b,view,8,0                                                                                   #? focus tag, browsing
bind=Super,m,view,9,0                                                                                   #? focus tag, music

# tag moving windows
#bind=Super+Shift,{Up | Down},                                                                          #? move window and focus tag
bind=Super+Shift,Up,tagtoleft,0
bind=Super+Shift,Down,tagtoright,0

# bind=Alt,1,tagsilent,1
#bind=Super+Shift,{1-9},                                                                                #? move window and focus tag, {1-9}
bind=Super+Shift,1,tag,1,0
bind=Super+Shift,2,tag,2,0
bind=Super+Shift,3,tag,3,0
bind=Super+Shift,4,tag,4,0
bind=Super+Shift,5,tag,5,0
bind=Super+Shift,6,tag,6,0
bind=Super+Shift,7,tag,7,0
bind=Super+Shift,8,tag,8,0
bind=Super+Shift,9,tag,9,0

# tag moving windows silently
#bind=Super+Shift+Alt,{N: 1-9},                                                                         #? move window to tag, N
bind=Super+Shift+Alt,1,tagsilent,1,0
bind=Super+Shift+Alt,2,tagsilent,2,0
bind=Super+Shift+Alt,3,tagsilent,3,0
bind=Super+Shift+Alt,4,tagsilent,4,0
bind=Super+Shift+Alt,5,tagsilent,5,0
bind=Super+Shift+Alt,6,tagsilent,6,0
bind=Super+Shift+Alt,7,tagsilent,7,0
bind=Super+Shift+Alt,8,tagsilent,8,0
bind=Super+Shift+Alt,9,tagsilent,9,0


# move windows
#bind=CTRL+Shift,{Up | Down | Left | Right},                                                            #? move floating window
bind=CTRL+Shift,Up,movewin,+0,-50
bind=CTRL+Shift,Down,movewin,+0,+50
bind=CTRL+Shift,Left,movewin,-50,+0
bind=CTRL+Shift,Right,movewin,+50,+0

# resize windows
#bind=CTRL+Alt,{Up | Down | Left | Right},                                                              #? resize window
bind=CTRL+Alt,Up,resizewin,+0,-50
bind=CTRL+Alt,Down,resizewin,+0,+50
bind=CTRL+Alt,Left,resizewin,-50,+0
bind=CTRL+Alt,Right,resizewin,+50,+0

# gaps
bind=Alt+Shift,x,incgaps,1
bind=Alt+Shift,z,incgaps,-1
bind=Super+Shift,g,togglegaps                                                                           #? toggle gaps


# mouse buttons
mousebind=Super,btn_left,moveresize,curmove
mousebind=Super,btn_middle,togglemaximizescreen,0
# mousebind=Super,btn_right,moveresize,curresize

# axis bindings
# axisbind=Super,UP,viewtoleft_have_client
# axisbind=Super,DOWN,viewtoright_have_client

# gestures
gesturebind=None,Left,3,focusdir,left
gesturebind=None,Right,3,focusdir,right
# gesturebind=None,up,3,focusdir,up
# gesturebind=None,down,3,focusdir,down
gesturebind=None,Up,3,viewtoright
gesturebind=None,Down,3,viewtoleft
# gesturebind=None,right,4,viewprev_have_client
# gesturebind=None,left,4,viewnext_have_client
gesturebind=None,Up,4,enteroverview
gesturebind=None,Down,4,leaveoverview

# audio
bind=None,XF86AudioRaiseVolume,spawn,   wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=None,XF86AudioLowerVolume,spawn,   wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=None,XF86AudioMute,spawn,          wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bind=None,XF86AudioNext,spawn,          playerctl next
bind=None,XF86AudioPrev,spawn,          playerctl previous
bind=None,XF86AudioPlay,spawn,          playerctl play-pause

# brightness
bind=None,XF86MonBrightnessUp,spawn,    brightnessctl set +10%
bind=None,XF86MonBrightnessDown,spawn,  brightnessctl set 10%-

# copy/paste
bind=Super,c,spawn,                     wtype -M ctrl -k Insert -m ctrl
bind=Super,v,spawn,                     wtype -M shift -k Insert -m shift


# layer rule
# layer_rule=animation_type_open:zoom,layer_name:rofi
# layer_rule=animation_type_close:zoom,layer_name:rofi

# window rules
window_rule=is_floating:1,app_id:kitty-floating
window_rule=is_floating:1,app_id:imv
window_rule=animation_type_open:zoom,app_id:imv
window_rule=animation_type_close:zoom,app_id:imv
window_rule=scroller_proportion:1.0,tags:8,app_id:qutebrowser
window_rule=scroller_proportion:1.0,tags:9,app_id:Spotify


# startup
exec_once=~/bin/wallset.sh
exec_once=~/bin/music_notifications.sh spotify
exec_once=mangobar
